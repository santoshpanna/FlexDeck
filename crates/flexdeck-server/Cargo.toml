[package]
name = "flexdeck-server"
description = "The flexdeck agent's HTTP API and WebSocket hub."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
flexdeck-actions = { path = "../flexdeck-actions" }
flexdeck-automation = { path = "../flexdeck-automation" }
flexdeck-expr = { path = "../flexdeck-expr" }
flexdeck-pairing = { path = "../flexdeck-pairing" }
flexdeck-plugin = { path = "../flexdeck-plugin" }
flexdeck-plugin-host = { path = "../flexdeck-plugin-host" }
flexdeck-plugin-abi = { path = "../flexdeck-plugin-abi", features = ["package"] }
flexdeck-protocol = { path = "../flexdeck-protocol" }
flexdeck-store = { path = "../flexdeck-store" }
flexdeck-tunnel = { path = "../flexdeck-tunnel" }
flexdeck-vars = { path = "../flexdeck-vars" }
futures-util = "0.3.34"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
json-patch = "4.2.0"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
url = "2"
# `rustls-no-provider`: the agent already links rustls with aws-lc-rs, and a
# second provider (ureq's default is ring) makes rustls refuse to pick either.
ureq = { version = "3", default-features = false, features = ["json", "gzip", "rustls-no-provider", "rustls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Uploaded pictures are decoded, checked and written again, never kept as sent.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
flexdeck-actions = { path = "../flexdeck-actions" }
tempfile = "3.27.0"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5.3", features = ["util"] }

[[test]]
name = "plugins"
harness = false
