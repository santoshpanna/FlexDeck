[package]
name = "flexdeck-plugin-sdk"
description = "Write a native flexdeck plugin in Rust: describe it, and the SDK speaks the protocol."
# Not the workspace's version: a placeholder that `release(rust-sdk): vX.Y.Z`
# replaces at publish time (scripts/release/sdk-version.ts).
version = "0.1.0"
edition.workspace = true
license = "MIT"
rust-version.workspace = true
repository = "https://github.com/santoshpanna/FlexDeck"
homepage = "https://flex-deck.com"
readme = "README.md"
keywords = ["flexdeck", "plugin", "sdk"]

# Only the contract and JSON. A plugin is a separate program the user installs,
# so it must not drag in the agent's input injection or Windows bindings.
[dependencies]
flexdeck-plugin-abi = { path = "../flexdeck-plugin-abi", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
# `images/put` names the image by its sha256 and carries it as base64.
base64 = "0.22"
sha2 = "0.10"
