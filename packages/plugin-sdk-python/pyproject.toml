[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flexdeck-plugin"
version = "0.1.0"
description = "Write FlexDeck plugins in Python: declare actions, values, events and feeds; test, pack and verify them against FlexDeck itself."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
keywords = ["flexdeck", "plugin", "sdk", "deck", "tablet"]
dependencies = []

[project.scripts]
flexdeck-plugin = "flexdeck_plugin.__main__:main"

[tool.setuptools]
packages = ["flexdeck_plugin"]
