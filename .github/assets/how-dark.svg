    <text x="480" y="412" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="12" font-weight="600" letter-spacing="1" text-anchor="middle" fill="#8d8c86">The desktop dials out. Nothing dials in.</text>
