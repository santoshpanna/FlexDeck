    <text x="790" y="330" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle" fill="#ff5a1f">03 · EDIT</text>
