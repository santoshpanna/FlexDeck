    <text x="634" y="198" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="10" font-weight="600" letter-spacing="1.5" text-anchor="middle" fill="#8d8c86">OR RELAY</text>
    
