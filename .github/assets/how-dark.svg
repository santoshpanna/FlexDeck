    <circle cx="188" cy="174" r="3" fill="#ff5a1f"><animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="113" y="191" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="0" text-anchor="middle" fill="#ecebe6">CAM</text>
    <text x="171" y="191" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="0" text-anchor="middle" fill="#ff5a1f">REC</text>
