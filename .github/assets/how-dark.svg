<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="How it works: the tablet talks to the desktop app over your Wi-Fi with pinned TLS; you edit the deck in a browser, directly on the same PC or through the relay.">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1" fill="#ffffff12"/></pattern>
    <linearGradient id="keyshine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="litglow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0.24"/><stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="960" height="430" rx="24" fill="#0b0b0c"/>
  <rect width="960" height="430" rx="24" fill="url(#dots)"/>
  <text x="40" y="58" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" letter-spacing="2.5" text-anchor="start" fill="#ff5a1f">// HOW IT WORKS</text>
  <text x="40" y="98" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="30" font-weight="600" letter-spacing="-0.5" text-anchor="start" fill="#ecebe6">Three pieces. No ports to open.</text>
  
    
    <line x1="282" y1="212" x2="370" y2="212" stroke="#26262a" stroke-width="2"/>
    <line x1="282" y1="212" x2="370" y2="212" stroke="#ff5a1f" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <text x="326" y="184" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1.5" text-anchor="middle" fill="#8d8c86">LAN</text>
    <text x="326" y="198" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="10" font-weight="600" letter-spacing="1.5" text-anchor="middle" fill="#8d8c86">PINNED TLS</text>
    
    <line x1="590" y1="212" x2="678" y2="212" stroke="#26262a" stroke-width="2"/>
