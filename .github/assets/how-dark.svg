    <text x="171" y="242" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="0" text-anchor="middle" fill="#ecebe6">SCENE</text>
    <text x="229" y="242" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="0" text-anchor="middle" fill="#ecebe6">PLAY</text>
    
