    <text x="170" y="356" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="18" font-weight="700" letter-spacing="0" text-anchor="middle" fill="#ecebe6">Pair the tablet</text>
    <text x="170" y="378" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="13.5" font-weight="400" letter-spacing="0" text-anchor="middle" fill="#8d8c86">six digits, once</text>
    
    <text x="480" y="330" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle" fill="#ff5a1f">01 · INSTALL</text>
