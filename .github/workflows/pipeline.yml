name: Pipeline

# Everything that happens after a push to main, in order:
#
#   changelog ──┬── web       public pages → Vercel                 every push
#               ├── server    editor + API → Docker Hub → Easypanel    when its code changed, or a release names it
#               ├── desktop ──┐                                      on a release commit naming it
#               └── android ──┴── publish   GitHub release + notes   on a release commit
#
# The changelog runs first and everything else builds from what it produced:
# the regenerated `releases.json` is what the web pages render, and a commit
# carrying `release: vX.Y.Z` is what turns on the desktop, Android and server
# releases; `release(desktop): …`, `release(android): …` or `release(server): …`
# ships just the ones it names.
# Each stage is its own workflow file, also runnable by hand.
on:
  push:
    branches:
      - main
    paths-ignore:
      - CHANGELOG.md
      - apps/portal/src/modules/changelog/releases.json
  workflow_dispatch:

permissions:
  contents: write

# Queue rather than cancel: a cancelled run could leave a tag without a release.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      release: ${{ steps.release.outputs.version }}
      desktop: ${{ steps.release.outputs.desktop }}
      android: ${{ steps.release.outputs.android }}
      server: ${{ steps.release.outputs.server == 'true' || steps.changes.outputs.server == 'true' }}
      server_release: ${{ steps.release.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # The whole history and every tag: releases are cut by commits.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Parser tests
        run: node --test scripts/changelog/changelog.test.ts

      - name: Regenerate and tag releases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/changelog/changelog.ts --tag
          git push origin --tags

      - name: Commit if changed
        id: commit
        run: |
          if ! git diff --quiet -- CHANGELOG.md apps/portal/src/modules/changelog/releases.json; then
            git add CHANGELOG.md apps/portal/src/modules/changelog/releases.json
            git commit -m "chore(changelog): regenerate [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The newest release with no GitHub release yet. Checking the release, not
      # the tag, makes a failed build retryable: run the pipeline again by hand.
      - name: Release to build
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          log=./apps/portal/src/modules/changelog/releases.json
          version=$(node -p "require('$log').releases[0]?.version ?? ''")
          if [ -n "$version" ] && ! gh release view "$version" > /dev/null 2>&1; then
            platforms=$(node -p "require('$log').releases[0].platforms.join(' ')")
            echo "Building release $version for: $platforms."
            echo "version=$version" >> "$GITHUB_OUTPUT"
            for platform in desktop android server; do
              case " $platforms " in *" $platform "*) echo "$platform=true" >> "$GITHUB_OUTPUT" ;; esac
            done
          fi

      # Restarting the server drops every live editor session, so it only
      # happens when something it serves changed.
      - name: Does the server need a deploy
        id: changes
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "server=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$before" "${{ github.sha }}" | grep -qE '^(crates/|apps/portal/|packages/|contract/|Cargo\.(toml|lock)$|Dockerfile$|pnpm-lock\.yaml$)'; then
            echo "server=true" >> "$GITHUB_OUTPUT"
          else
            echo "server=false" >> "$GITHUB_OUTPUT"
          fi

  web:
    name: Web
    needs: changelog
    uses: ./.github/workflows/web.yml
    with:
      ref: ${{ needs.changelog.outputs.sha }}
    secrets: inherit

  server:
    name: Server
    needs: changelog
    if: needs.changelog.outputs.server == 'true'
    uses: ./.github/workflows/server.yml
    with:
      ref: ${{ needs.changelog.outputs.sha }}
      version: ${{ needs.changelog.outputs.server_release == 'true' && needs.changelog.outputs.release || '' }}
    secrets: inherit

  desktop:
    name: Desktop
    needs: changelog
    if: needs.changelog.outputs.desktop == 'true'
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ needs.changelog.outputs.release }}
      ref: ${{ needs.changelog.outputs.release }}

  android:
    name: Android
    needs: changelog
    if: needs.changelog.outputs.android == 'true'
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ needs.changelog.outputs.release }}
      ref: ${{ needs.changelog.outputs.release }}
      signed: true
    secrets: inherit

  publish:
    name: Publish release
    needs: [changelog, desktop, android]
    # A skipped build is fine (that app is not in this release); a failed one is not.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changelog.outputs.release != '' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.changelog.outputs.release }}
      GH_TOKEN: ${{ github.token }}
      # Every file a release carries. The download page links to some of them
      # through releases/latest/download/<name>: see apps/portal/src/common/release.
      FILES: >-
        flexdeck-windows-x64-setup.exe
        flexdeck-android.apk
        flexdeck-linux-x64.AppImage
        flexdeck-linux-x64.deb
        flexdeck-android-arm64-v8a.apk
        flexdeck-android-armeabi-v7a.apk
        flexdeck-android-x86_64.apk
        flexdeck-android-x86.apk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Only the apps: the server job's Docker build record is an artifact too,
      # and it does not download. A single-app release matches just one.
      - uses: actions/download-artifact@v8
        with:
          pattern: "{desktop-*,android}"
          path: out
          merge-multiple: true

      # An app this release did not build keeps its files from the release
      # before, so its download links never break.
      - name: Carry over the other apps
        run: |
          mkdir -p out
          for file in $FILES; do
            if [ ! -f "out/$file" ]; then
              if gh release download --pattern "$file" --dir out; then
                echo "Carried $file over from the previous release."
              else
                echo "::warning::$file is not in this release or any before it."
              fi
            fi
          done

      - name: Checksums
        working-directory: out
        run: |
          ls -l
          files=$(ls $FILES 2>/dev/null || true)
          test -n "$files"
          sha256sum $files > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the GitHub release
        run: |
          node scripts/changelog/changelog.ts --notes "$VERSION" > notes.md
          title=$(node scripts/changelog/changelog.ts --notes "$VERSION" --title)
          gh release create "$VERSION" $(cd out && ls $FILES 2>/dev/null | sed 's|^|out/|') out/SHA256SUMS.txt \
            --verify-tag --latest --title "$VERSION — $title" --notes-file notes.md
