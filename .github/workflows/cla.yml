name: CLA

# Asks every outside contributor to sign CLA.md once, by commenting on their pull
# request, and records the signature in the `cla-signatures` branch. Owner and bot
# pull requests are exempt.
#
# `pull_request_target` runs with this repository's token so it can comment and
# set the status; it never checks out the pull request's code.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/santoshpanna/FlexDeck/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: santoshpanna,dependabot[bot],github-actions[bot]
