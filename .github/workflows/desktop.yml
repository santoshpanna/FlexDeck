name: Desktop

# The desktop installers (Tauri): Windows (NSIS) and Linux (AppImage, .deb),
# uploaded as the `desktop-windows` and `desktop-linux` artifacts. No macOS yet.
#
# Called by the pipeline for a release commit; the publish job attaches the
# installers to the GitHub release. Run it by hand for a test build.
#
# The installer is not code-signed yet, so Windows SmartScreen warns on first
# run. Signing slots in after "Build" once there is a certificate.
on:
  workflow_call:
    inputs:
      version:
        description: Release version, e.g. v0.2.0
        type: string
        required: true
      ref:
        description: Commit or tag to build
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the build
        type: string
        default: v0.0.0-dev

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      # One platform failing should not hide whether the other builds.
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
            artifact: desktop-windows
            bundles: nsis
          - name: Linux packages
            os: ubuntu-22.04
            artifact: desktop-linux
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Tauri (webkit2gtk, gtk, appindicator) and enigo (libxdo) link against
      # these. 22.04 rather than latest: an AppImage only runs on distributions
      # at least as new as the one it was built on.
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Stamp version
        run: node scripts/release/version.ts "${{ inputs.version }}" --desktop

      - name: Build
        run: pnpm --filter @flexdeck/desktop tauri build --bundles ${{ matrix.bundles }}

      # Fixed names: the download page links to releases/latest/download/<name>.
      - name: Collect
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/bundle/nsis/*-setup.exe out/flexdeck-windows-x64-setup.exe
          else
            cp target/release/bundle/appimage/*.AppImage out/flexdeck-linux-x64.AppImage
            cp target/release/bundle/deb/*.deb out/flexdeck-linux-x64.deb
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error
