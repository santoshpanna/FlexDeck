name: Server

# The cloud — the editor and its API on one origin — to the VPS via Easypanel.
#
# Builds the Dockerfile at the repository root, pushes it to Docker Hub, then
# calls the Easypanel service's deploy webhook, which pulls the
# new image and restarts the container behind Easypanel's proxy.
#
# Easypanel service (one-time setup): source "Docker image"
#   <DOCKERHUB_USERNAME>/flexdeck-cloud:latest, port 8787, a volume at /data,
#   domain app.flex-deck.com. A private repository also needs Docker Hub
#   credentials in Easypanel (a read-only access token).
#
# Variable: DOCKERHUB_USERNAME — the Docker Hub account (or organisation)
# Secrets:  DOCKERHUB_TOKEN — a Docker Hub access token with write access
#           EASYPANEL_DEPLOY_WEBHOOK — the service's "Deploy webhook" URL
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to deploy
        type: string
        required: true
      version:
        description: Release version, e.g. v0.2.0; empty for an ordinary deploy
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build image and deploy
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/flexdeck-cloud
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Docker Hub account set
        run: |
          if [ -z "${{ vars.DOCKERHUB_USERNAME }}" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME repository variable (and the DOCKERHUB_TOKEN secret)."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # A release also gets its version as a tag, to roll back to by name.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ inputs.ref || github.sha }}
            ${{ inputs.version && format('{0}:{1}', env.IMAGE, inputs.version) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy on Easypanel
        env:
          HOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::EASYPANEL_DEPLOY_WEBHOOK is not set — the image is pushed but nothing redeployed it."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$HOOK"
