version: v2
clean: true

# TypeScript + Rust are generated here. Kotlin is NOT generated by buf: the
# Android side uses the Square Wire Gradle plugin, which is wired up in
# android/core/protocol/build.gradle.kts.
plugins:
  # TypeScript: message types plus proto3-JSON mapping (fromJson / toJson).
  - local: protoc-gen-es
    out: ../packages/protocol/src/generated
    opt:
      - target=ts

  # Rust: prost structs plus pbjson serde impls that are compliant with the
  # proto3 JSON mapping, so the same JSON round-trips on both sides.
  - local: protoc-gen-prost
    out: ../crates/flexdeck-protocol/src/generated
  - local: protoc-gen-pbjson
    out: ../crates/flexdeck-protocol/src/generated
