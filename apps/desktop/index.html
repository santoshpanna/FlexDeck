<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flexdeck</title>
    <script>
      /*
        Put the appearance on <html> BEFORE the first paint.

        This is the only reason the script exists: a module cannot run early
        enough to stop a light flash in a production build, and a flash is the
        one thing a theme system must not do. It must agree with
        `@flexdeck/tokens/theme.ts` on the key and the class name — that module
        takes over from here and re-applies the same decision.

        Wrapped in try/catch because a blocked storage must not stop the window
        from opening; the fallback is "follow the system", which is the default.
      */
      (function () {
        try {
          var choice = localStorage.getItem("flexdeck.theme") || "system";
          var dark =
            choice === "dark" ||
            (choice === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (error) {
          /* no storage, no preference: the system decides */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
