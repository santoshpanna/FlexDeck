[package]
name = "flexdeck-desktop"
description = "The flexdeck desktop window: what this computer is doing, and who is connected."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
flexdeck-actions = { path = "../../../crates/flexdeck-actions" }
flexdeck-agent = { path = "../../agent" }
flexdeck-pairing = { path = "../../../crates/flexdeck-pairing" }
flexdeck-server = { path = "../../../crates/flexdeck-server" }
base64 = "0.23"
open = "5"
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
tauri-plugin-autostart = "2"
