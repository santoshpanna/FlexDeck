# A plugin repository on GitHub Pages, rebuilt on every push.
#
# Copy this to .github/workflows/plugin-repo.yml in your plugin's repository,
# turn on Pages (Settings → Pages → Source: GitHub Actions), and your
# repository's address is https://<you>.github.io/<repo>/ — which is what
# people type under Repositories in flexdeck.
#
# The last published index is fetched first, so `releaseDate` stays the day a
# plugin first appeared, and code that changed without a new version is
# refused instead of silently replacing what people installed.
name: Plugin repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Your plugin's dependencies, @flexdeck/plugin-sdk among them: it is
      # `flexdeck-plugin pack` and `flexdeck-plugin repo`.
      - name: Install
        run: npm ci --no-audit --no-fund

      # What was published before, so the index keeps its history.
      - name: Restore the published site
        continue-on-error: true
        run: |
          mkdir -p site
          curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repository.json" -o site/repository.json || true

      - name: Pack and index
        run: |
          npx flexdeck-plugin pack .
          mkdir -p site/packages site/icons
          cp *.fdpkg site/packages/
          if [ -d icons ]; then cp icons/* site/icons/; fi
          npx flexdeck-plugin repo site/packages --out site --icons site/icons \
            --name "${{ github.event.repository.name }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
