[package]
name = "flexdeck-plugin-soundboard"
description = "The flexdeck soundboard plugin: clips to your headphones and, through a virtual cable, your microphone."
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "flexdeck-soundboard"
path = "src/main.rs"

[dependencies]
flexdeck-plugin-sdk = { path = "../../crates/flexdeck-plugin-sdk" }
serde_json = { workspace = true }
cpal = "0.15.3"
symphonia = { version = "0.5.4", default-features = false, features = ["mp3", "wav", "pcm", "flac", "ogg", "vorbis", "aac", "isomp4", "adpcm"] }
# The same TLS setup as the agent: rustls with aws-lc-rs only. A second provider
# (ureq 2 brings ring) leaves rustls unable to pick one, workspace-wide.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
